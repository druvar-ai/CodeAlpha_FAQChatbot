<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha FAQ Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>CodeAlpha FAQ Chatbot</h1>
            <p>Task 2 - NLP Similarity Bot</p>
        </header>
        
        <main class="chat-main" id="chat-box">
            <div class="message bot">
                <div class="message-content">
                    Hello! Ask me a question about Python programming or the CodeAlpha internship.
                </div>
            </div>
        </main>
        
        <footer class="chat-footer">
            <form id="chat-form" class="chat-form">
                <input type="text" id="user-input" placeholder="Type your question here..." autocomplete="off">
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="send-icon"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
            <div id="error-message" class="error-message hidden"></div>
        </footer>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
